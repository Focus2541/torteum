<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#c2410c">
<title>จำลองการสร้างห้องทีละขั้น</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Sarabun,system-ui,sans-serif;background:#e9e5dc;color:#1f2328}
#c{position:fixed;left:0;top:0;width:100%;display:block;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:14px;pointer-events:none}
.top a,.top button{pointer-events:auto}
.top a{color:#c2410c;text-decoration:none;background:rgba(255,255,255,.85);padding:5px 10px;border-radius:9px}
.chip{font:inherit;font-size:13px;background:rgba(255,255,255,.85);border:1px solid #ddd6c8;border-radius:9px;padding:5px 10px;cursor:pointer}
.chip.on{background:#c2410c;color:#fff;border-color:#c2410c}
.panel{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid #e3e0d8;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.in{max-width:820px;margin:auto}
.bar{height:5px;background:#eee8dc;border-radius:3px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:#c2410c;width:0;transition:width .4s}
.st{font-size:13px;color:#c2410c;font-weight:700}
h1{font-size:18px;margin:2px 0 4px;line-height:1.3}
.txt{font-size:14.5px;line-height:1.5;color:#3b3f45;min-height:44px;max-height:30vh;overflow:auto}
.txt b{color:#1f2328}.txt .k{display:inline-block;background:#fff3ea;color:#9a3412;border-radius:6px;padding:0 6px;margin:1px 2px;font-weight:600;font-size:13.5px}
.ctl{display:flex;gap:8px;margin-top:8px}
.ctl button{flex:1;font:inherit;font-size:15px;border:none;border-radius:11px;padding:10px;cursor:pointer;background:#f1ede4;color:#1f2328}
.ctl button.pri{background:#c2410c;color:#fff;flex:1.4}
.ctl button:disabled{opacity:.4}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:#e9e5dc}
@media (prefers-color-scheme:dark){.panel{background:rgba(32,35,39,.96);border-color:#33373d}.txt{color:#c9ccd1}.txt b,h1{color:#eceae5}.ctl button{background:#33373d;color:#eceae5}.bar{background:#33373d}.txt .k{background:#2c2219;color:#fdba74}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><a href="./">← หน้าหลัก</a><span><button class="chip" id="voice">🔇 เสียง</button> <button class="chip" id="xray">มองทะลุ</button></span></div>
<div class="panel"><div class="in">
 <div class="bar"><i id="prog"></i></div>
 <div class="st" id="stn"></div>
 <h1 id="ttl"></h1>
 <div class="txt" id="txt"></div>
 <div class="ctl"><button id="prev">◀ ก่อนหน้า</button><button id="play">▶ เล่นต่อเนื่อง</button><button class="pri" id="next">ขั้นถัดไป ▶</button></div>
</div></div>
<div id="err"><div><b>เครื่องนี้แสดง 3D ไม่ได้</b><br>ลองเปิดด้วย Chrome รุ่นใหม่ หรือดูขั้นตอนในหน้า <a href="guide.html">สอนทำ</a></div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
/* หน่วย ซม. · x = ตามแนวยาว 0–780 · z = จากผนังเดิม (0) ไปผนังใหม่ (250) · y = สูง */
const H=185,BAND=125,TW=7.5;
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true})}catch(e){document.getElementById('err').style.display='grid';throw e}
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9e5dc);scene.fog=new THREE.Fog(0xe9e5dc,1500,3400);
const camera=new THREE.PerspectiveCamera(50,1,5,6000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.495;controls.minDistance=60;controls.maxDistance=1800;
scene.add(new THREE.HemisphereLight(0xffffff,0xb9a98f,.8));
const sun=new THREE.DirectionalLight(0xfff3dd,.7);sun.position.set(-300,900,900);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-700,right:700,top:700,bottom:-700,near:100,far:3000});sun.target.position.set(390,0,125);scene.add(sun,sun.target);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:o.r??.85,metalness:o.m??0,transparent:o.t!=null,opacity:o.t??1,side:o.ds?THREE.DoubleSide:THREE.FrontSide});
const MAT={floor:M(0xb8b4ab,{r:1}),ground:M(0xa9b08a,{r:1}),old:M(0xf1ede4),wood:M(0x8a6440),wood2:M(0xb48a5e),
 track:M(0x0f766e,{m:.45,r:.45}),stud:M(0x9aa3ad,{m:.55,r:.4}),hi:M(0xdc2626,{m:.3,r:.5}),nog:M(0x6b7280,{m:.5,r:.45}),
 line:new THREE.MeshBasicMaterial({color:0xdc2626}),anc:M(0x111827),pipe:M(0xf8fafc,{r:.5}),pbox:M(0xf59e0b),
 bOut:M(0xd9d4c7),bIn:M(0xe3dfd5),poly:M(0x9fd3ff,{t:.45,r:.2,ds:true}),door:M(0x9a6b42),frame:M(0xb48a5e),chrome:M(0xd1d5db,{m:1,r:.25}),seal:M(0x9ca3af)};
const PAINT_OUT=0xeae3d2,PAINT_IN=0xf6f3ec;
const box=(x0,x1,y0,y1,z0,z1,mat,par,cast=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(Math.max(.1,x1-x0),Math.max(.1,y1-y0),Math.max(.1,z1-z0)),mat);m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);m.castShadow=cast;m.receiveShadow=true;(par||scene).add(m);return m};
function label(text,x,y,z,size=22,flat=true,col='#c2410c',par){const cv=document.createElement('canvas');cv.width=1024;cv.height=160;const c=cv.getContext('2d');c.font='700 92px Sarabun, sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineWidth=14;c.strokeStyle='rgba(255,255,255,.9)';c.strokeText(text,512,84);c.fillStyle=col;c.fillText(text,512,84);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(size*6.4,size),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false}));
 if(flat)m.rotation.set(-Math.PI/2,0,0);m.position.set(x,y,z);(par||scene).add(m);return m}

/* ---------- ฉากที่มีอยู่แล้ว ---------- */
box(-700,1500,-3,0,-400,1000,MAT.ground,null,false);box(-20,800,0,1,-15,265,MAT.floor,null,false);
box(-20,300,0,H+15,-15,0,MAT.old);box(400,800,0,H+15,-15,0,MAT.old);box(300,400,180,H+15,-15,0,MAT.old);
[0,260,520,780].forEach(x=>box(x-8,x+8,0,H+15,250-8+TW/2,250+8+TW/2,MAT.wood));
const joists=new THREE.Group();scene.add(joists);
for(let x=-10;x<=790;x+=60)box(x-3,x+3,H,H+15,-15,268,MAT.wood,joists);

/* ---------- ผนังที่จะสร้าง ----------
 axis 'x': วิ่งตาม x, ความหนาอยู่ช่วง z t0..t1 · axis 'z': วิ่งตาม z, ความหนาช่วง x t0..t1
 out = ฝั่งนอก (+1 = ฝั่ง t1, -1 = ฝั่ง t0) */
const WALLS=[
 {n:'ยาว ช่วง 1',axis:'x',a0:8,a1:252,t0:250,t1:250+TW,out:1,poly:true},
 {n:'ยาว ช่วง 2',axis:'x',a0:268,a1:512,t0:250,t1:250+TW,out:1},
 {n:'ยาว ช่วง 3',axis:'x',a0:528,a1:772,t0:250,t1:250+TW,out:1},
 {n:'หัวห้องบน',axis:'z',a0:0,a1:250,t0:-TW,t1:0,out:-1,poly:true},
 {n:'หัวห้องล่าง',axis:'z',a0:0,a1:250,t0:780,t1:780+TW,out:1},
 {n:'ผนังกั้น',axis:'z',a0:0,a1:250,t0:516,t1:516+TW,out:1,door:[20,100,175]}];
const W2=(w,a0,a1,y0,y1,t0,t1,mat,par)=>w.axis==='x'?box(a0,a1,y0,y1,t0,t1,mat,par):box(t0,t1,y0,y1,a0,a1,mat,par);

/* ---------- ขั้นตอน ---------- */
const S=[];
function step(o){o.g=new THREE.Group();o.items=[];scene.add(o.g);S.push(o);return o}
const add=(st,mesh,off,delay)=>{mesh.parent&&mesh.parent.remove(mesh);st.g.add(mesh);mesh.userData.fin=mesh.position.clone();mesh.userData.off=off;mesh.userData.d=delay;st.items.push(mesh);return mesh};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

// 0 ห้องเปล่า
step({t:'ห้องเปล่าใต้ถุนบ้าน',cam:[[-220,300,700],[400,50,125]],
 x:'พื้นเทปูนแล้ว มี<b>ผนังเดิมด้านยาว</b> และ<b>เสาบ้านทุก 2.6 ม.</b> ด้านตรงข้าม เพดานคือตงไม้ของชั้นบน สูง <span class="k">1.85 ม.</span> · ห้อง <span class="k">2.5 × 7.8 ม.</span>'});

// 1 ตีเส้น
{const st=step({t:'ตีเส้นแนวผนังบนพื้น',cam:[[390,560,520],[390,0,125]],
 x:'ใช้ <b>บักเต้าตีเส้น</b> หรือเชือกกับดินสอ ขีดแนว<b>ขอบรางยู</b>ทั้ง 2 ข้างบนพื้น วัดจากผนังเดิมให้ได้ <span class="k">250 ซม.</span> เท่ากันทั้งหัวและท้าย แล้วใช้<b>ลูกดิ่ง</b>ถ่ายแนวขึ้นไปขีดที่ตงด้านบนให้ตรงกัน'});
 let i=0;WALLS.forEach(w=>{[w.t0,w.t1].forEach(t=>{const m=w.axis==='x'?box(w.a0,w.a1,1,1.6,t-.6,t+.6,MAT.line,null,false):box(t-.6,t+.6,1,1.6,w.a0,w.a1,MAT.line,null,false);add(st,m,V(0,0,0),i++*.12).userData.tmp=1})});
 [label('7.80 ม.',390,2,285,26),label('2.50 ม.',-40,2,125,22),label('ผนังกั้น x 5.20',560,2,170,18)].forEach((l,k)=>{l.rotation.z=k===1?Math.PI/2:0;add(st,l,V(0,0,0),1+k*.2).userData.tmp=1})}

// 2 รางยูล่าง
{const st=step({t:'ยึดรางยูที่พื้น',cam:[[120,260,520],[300,0,200]],
 x:'วางรางยู (U) ตามเส้น เจาะพื้นปูนแล้วยึด<b>พุกเหล็ก/พุกพลาสติก + สกรู</b> ทุก <span class="k">60 ซม.</span> ห่างปลายราง <span class="k">10 ซม.</span> · <b>เว้นช่องประตู</b>ไม่ต้องวางราง · ใต้รางรองยาง/ซิลิโคนกันน้ำ เพราะใต้ถุนชื้น'});
 let i=0;WALLS.forEach(w=>{const segs=w.door?[[w.a0,w.door[0]],[w.door[1],w.a1]]:[[w.a0,w.a1]];
  segs.forEach(([p,q])=>{add(st,W2(w,p,q,1,4,w.t0,w.t1,MAT.track),V(0,50,0),i*.25);
   for(let a=p+10;a<=q-5;a+=60){add(st,W2(w,a-1.2,a+1.2,4,5,(w.t0+w.t1)/2-1.2,(w.t0+w.t1)/2+1.2,MAT.anc),V(0,30,0),i*.25+.5)}i++})})}

// 3 รางยูบน
{const st=step({t:'ยึดรางยูที่ตงด้านบน',cam:[[-150,120,420],[300,170,200]],
 x:'ยึดรางยูบนเข้ากับ<b>ตงไม้</b>ด้วย<b>สกรูเกลียวปล่อยยิงไม้</b> ทุกตงที่พาด หรือทุก <span class="k">60 ซม.</span> ใช้ลูกดิ่งเช็กว่าตรงกับรางล่างพอดี (ผนังไม่เอียง) · ผนังกั้นวางรางบนยาวตลอด รวมเหนือประตู'});
 let i=0;WALLS.forEach(w=>{add(st,W2(w,w.a0,w.a1,H-3,H,w.t0,w.t1,MAT.track),V(0,-60,0),i++*.25)})}

// 4 เสาซี
{const st=step({t:'ตั้งเสาซีทุก 60 ซม.',cam:[[-200,330,560],[360,80,180]],
 x:'ตัดเสาซี<b>สั้นกว่าความสูงจริง 1 ซม.</b> เสียบเข้ารางล่างแล้วบิดเข้ารางบน วางห่างกัน <span class="k">60 ซม.</span> (กึ่งกลางถึงกึ่งกลาง) ให้รอยต่อแผ่นตกกลางเสา · ยิง<b>สกรูหัวเวเฟอร์</b>ยึดเสากับรางล่างทั้ง 2 ปีก · <b>รางบนไม่ต้องยิง</b> เผื่อตงไม้ยืดหด · มุมห้องใช้เสาคู่'});
 let i=0;WALLS.forEach(w=>{const pos=[];for(let a=w.a0+2;a<w.a1-2;a+=60)pos.push(a);pos.push(w.a1-2);
  pos.forEach(a=>{if(w.door&&a>w.door[0]-4&&a<w.door[1]+4)return;add(st,W2(w,a-2,a+2,4,H-3,w.t0+.8,w.t1-.8,MAT.stud),V(0,H+40,0),i++*.07)})})}

// 5 โครงประตู
{const st=step({t:'เสริมโครงวงกบประตู',near:1,cam:[[700,150,185],[520,90,60]],hide:['joists'],
 x:'ข้างวงกบตั้ง<b>เสาคู่</b> (ซีสองตัวประกบกันเป็นกล่อง) ทั้งซ้ายขวา · เหนือประตูที่ <span class="k">175 ซม.</span> วาง<b>รางยูพับปีก 10 ซม.</b> เป็นทับหลัง ยึดเข้ากับเสาคู่ แล้วตั้ง<b>เสาสั้น</b>จากทับหลังขึ้นไปรางบน · ช่องเปิดกว้าง <span class="k">80 ซม.</span> ห่างผนังเดิม 20 ซม.'});
 const w=WALLS[5],[d0,d1,dh]=w.door;let i=0;
 [[d0-4,d0],[d0-8,d0-4],[d1,d1+4],[d1+4,d1+8]].forEach(([p,q])=>add(st,W2(w,p,q,4,H-3,w.t0+.8,w.t1-.8,MAT.hi),V(0,H+30,0),i++*.25));
 add(st,W2(w,d0-8,d1+8,dh,dh+3,w.t0,w.t1,MAT.hi),V(0,40,0),1.1);
 [d0+18,(d0+d1)/2,d1-18].forEach(a=>add(st,W2(w,a-2,a+2,dh+3,H-3,w.t0+.8,w.t1-.8,MAT.hi),V(0,30,0),1.4+i++*.1));
 {const l=add(st,label('ประตู 80 × 175',520,dh/2,60,14,false),V(0,0,0),1.8);l.rotation.y=Math.PI/2;l.userData.tmp=1}}

// 6 คานนอน
{const st=step({t:'ใส่คานนอน (โนกกิ้ง)',cam:[[-180,240,520],[330,110,200]],
 x:'ตัดรางยูพับปีก ใส่<b>คานนอน</b>ระหว่างเสาที่ความสูง <span class="k">125 ซม.</span> ตรงแนวรอยต่อระหว่างแผ่นผนังกับแผ่นโพลีคาร์บอเนต และกลางผนังทุก <span class="k">120 ซม.</span> ช่วยให้โครงแข็ง ผนังไม่โยก และมีที่ยิงขอบแผ่น'});
 let i=0;WALLS.forEach(w=>{const ys=w.poly?[BAND]:[92];ys.forEach(y=>{const segs=w.door?[[w.a0,w.door[0]-8],[w.door[1]+8,w.a1]]:[[w.a0,w.a1]];
  segs.forEach(([p,q])=>add(st,W2(w,p+2,q-2,y-1.5,y+1.5,w.t0+1,w.t1-1,MAT.nog),V(0,0,w.out*40),i++*.2))})})}

// 7 ท่อไฟ
{const st=step({t:'เดินท่อร้อยสายไฟ ก่อนปิดแผ่น',cam:[[360,300,-40],[380,120,160]],
 x:'เดิน<b>ท่อ PVC ½ นิ้ว</b>ไปตามตง แล้ว<b>ทิ้งลงข้างเสาซี</b> ลอดรูเสา (ใส่ยางกันบาด) ไปที่<b>บล็อกสวิตช์ สูง 120</b> และ<b>บล็อกปลั๊ก สูง 30–100 ซม.</b> ยึดบล็อกเข้ากับเสา · ร้อยสายก่อนปิดแผ่นด้านใน (ดูรายละเอียดในหน้า ⚡ งานไฟฟ้า)'});
 const P=(x0,x1,y0,y1,z0,z1,d)=>add(st,box(x0,x1,y0,y1,z0,z1,MAT.pipe),V(0,0,0),d);
 P(130,650,H-6,H-3,123,127,0);P(348,352,H-6,H-3,2,125,.3);
 P(130,134,H-6,H-3,125,246,.6);P(132,135,100,H-6,246,249,.9);add(st,box(126,140,94,106,245,250,MAT.pbox),V(0,0,0),1.1);
 P(522,526,H-6,H-3,110,127,.6);P(522,526,120,H-6,107,110,.9);add(st,box(517,524,114,126,104,112,MAT.pbox),V(0,0,0),1.1);
 P(470,474,H-6,H-3,125,246,.8);P(472,475,30,H-6,246,249,1.1);add(st,box(466,480,24,36,245,250,MAT.pbox),V(0,0,0),1.3);
 [130,390,650].forEach((x,k)=>add(st,box(x-6,x+6,H-8,H-3,119,131,MAT.pbox),V(0,0,0),1.4+k*.15))}

// 8 แผ่นด้านนอก
{const st=step({t:'ปิดแผ่นสมาร์ทบอร์ดด้านนอก',cam:[[420,240,820],[390,80,250]],
 x:'ปิดด้านนอกก่อน (ด้านฝนสาด) แผ่น <span class="k">1.22 × 2.44 ม.</span> วางแนวตั้ง รอยต่อ<b>ตกกลางเสา</b> เว้นร่อง 3 มม. · ยิงสกรูห่างขอบ <span class="k">1 ซม.</span> ขอบแผ่นทุก <span class="k">20 ซม.</span> กลางแผ่นทุก <span class="k">30 ซม.</span> · ยกแผ่นสูงจากพื้น 1 ซม. กันดูดน้ำ · ผนังที่มีช่วงแสงปิดถึง 125 ซม.'});
 let i=0;WALLS.forEach(w=>{const top=w.poly?BAND:H;const tO=w.out>0?w.t1:w.t0-.9;
  for(let a=w.a0;a<w.a1-.5;a+=122){const q=Math.min(w.a1,a+122);
   if(w.door&&w.door[0]<q&&w.door[1]>a){if(a<w.door[0])add(st,W2(w,a,w.door[0],1,top,tO,tO+.9,MAT.bOut),V(0,0,w.out*60),i++*.15);
    add(st,W2(w,w.door[0],Math.min(q,w.door[1]),w.door[2]+3,top,tO,tO+.9,MAT.bOut),V(0,0,w.out*60),i++*.15);
    if(q>w.door[1])add(st,W2(w,w.door[1],q,1,top,tO,tO+.9,MAT.bOut),V(0,0,w.out*60),i++*.15);continue}
   add(st,W2(w,a+.15,q-.15,1,top,tO,tO+.9,MAT.bOut),V(0,0,w.out*60),i++*.15)}})}

// 9 โพลีคาร์บอเนต
{const st=step({t:'ติดแผ่นโพลีคาร์บอเนตช่วงบน',cam:[[-260,200,520],[60,150,200]],
 x:'ช่วงบนสูง <span class="k">60 ซม.</span> ของหัวห้องด้านบนและช่วงเสาแรก ใช้<b>โพลีคาร์บอเนตลอนคู่ 6 มม.</b> ให้<b>ร่องลอนตั้งดิ่ง</b> ปิดเทปอลูมิเนียมขอบบน เทประบายขอบล่าง · ด้าน UV ออกนอก · เจาะรูโตกว่าสกรู 2–3 มม. ใช้สกรูแหวนยางทุก 30 ซม. · ซ้อนทับแผ่นผนังด้านล่าง 2–3 ซม. ยิงซิลิโคนชนิดไม่กัดกร่อน'});
 let i=0;WALLS.filter(w=>w.poly).forEach(w=>{const tO=w.out>0?w.t1+.2:w.t0-1.1;for(let a=w.a0;a<w.a1-.5;a+=122){const q=Math.min(w.a1,a+122);add(st,W2(w,a+.2,q-.2,BAND-3,H,tO,tO+.9,MAT.poly),V(0,60,0),i++*.3)}})}

// 10 แผ่นด้านใน
{const st=step({t:'ปิดแผ่นด้านใน',near:1,cam:[[650,140,40],[250,90,200]],hide:['joists'],
 x:'ร้อยสายไฟให้เสร็จก่อน แล้วปิดแผ่นด้านใน วาง<b>รอยต่อสลับกับด้านนอก</b> (ไม่ตรงเสาเดียวกัน) · เจาะช่องบล็อกปลั๊ก/สวิตช์ตามตำแหน่งที่วัดไว้ · ด้านในจะทำทีหลังก็ได้ถ้างบไม่พอ'});
 let i=0;WALLS.forEach(w=>{const top=w.poly?BAND:H;const tI=w.out>0?w.t0-.9:w.t1;const segs=[];let a=w.a0;const first=61;
  for(let p=w.a0,q=w.a0+first;p<w.a1-.5;p=q,q=Math.min(w.a1,q+122))segs.push([p,Math.min(q,w.a1)]);
  segs.forEach(([p,q])=>{if(w.door&&w.door[0]<q&&w.door[1]>p){if(p<w.door[0])add(st,W2(w,p,w.door[0],1,top,tI,tI+.9,MAT.bIn),V(0,0,-w.out*50),i++*.12);
    add(st,W2(w,Math.max(p,w.door[0]),Math.min(q,w.door[1]),w.door[2]+3,top,tI,tI+.9,MAT.bIn),V(0,0,-w.out*50),i++*.12);
    if(q>w.door[1])add(st,W2(w,w.door[1],q,1,top,tI,tI+.9,MAT.bIn),V(0,0,-w.out*50),i++*.12);return}
   add(st,W2(w,p+.15,q-.15,1,top,tI,tI+.9,MAT.bIn),V(0,0,-w.out*50),i++*.12)})})}

// 11 ยาแนว + ทาสี
{const st=step({t:'อุดรอยต่อ ยาแนว แล้วทาสี',cam:[[420,240,820],[390,80,250]],paint:true,
 x:'ร่องรอยต่ออุดด้วย<b>วัสดุอุดรอยต่อไฟเบอร์ซีเมนต์</b> หรือโพลียูรีเทนซีลแลนท์ ขอบล่างติดพื้นยิง<b>ซิลิโคนกันน้ำ</b> · ทา<b>สีรองพื้นปูนใหม่</b> 1 รอบ แล้วทา<b>สีทับหน้าภายนอก</b> 2 รอบ ด้านนอกเลือกสีกันชื้น'});
 WALLS.forEach((w,k)=>{const tO=w.out>0?w.t1+.9:w.t0-1.3;add(st,W2(w,w.a0,w.a1,0,2,tO,tO+.5,MAT.seal),V(0,0,0),k*.1)})}

// 12 ประตู + เสร็จ
{const st=step({t:'ใส่วงกบ บานประตู — เสร็จ!',near:1,cam:[[690,140,190],[520,85,60]],paint:true,
 x:'ใส่<b>วงกบ</b>ยึดเข้ากับเสาคู่ทุก 40 ซม. เช็กดิ่งและฉาก แล้วแขวน<b>บานประตู 80 × 175</b> ด้วยบานพับ 3 ตัว ติดลูกบิด · ติดคิ้วปิดขอบ · เสร็จแล้ว! ลองหมุนดูรอบ ๆ ได้ หรือดูภาพเต็มพร้อมเฟอร์นิเจอร์ในหน้า 🧊 ภาพ 3D'});
 const x0=516,x1=516+TW,[d0,d1,dh]=WALLS[5].door;
 add(st,box(x0-1,x1+1,0,dh,d0,d0+3,MAT.frame),V(0,0,0),0);add(st,box(x0-1,x1+1,0,dh,d1-3,d1,MAT.frame),V(0,0,0),.15);add(st,box(x0-1,x1+1,dh-3,dh+3.5,d0,d1,MAT.frame),V(0,0,0),.3);
 const piv=new THREE.Group();piv.position.set(520,0,d1-3);const dm=new THREE.Mesh(new THREE.BoxGeometry(3.5,dh-4,d1-d0-6),MAT.door);dm.position.set(0,(dh-4)/2,-(d1-d0-6)/2);dm.castShadow=true;piv.add(dm);
 const kn=new THREE.Mesh(new THREE.SphereGeometry(2.2,12,8),MAT.chrome);kn.position.set(-3,95,-(d1-d0-12));piv.add(kn);piv.rotation.y=.55;
 add(st,piv,V(0,0,0),.6);st.door=piv}

/* ---------- เล่นขั้นตอน ---------- */
let cur=0,t0=0,auto=false,voice=false,xray=false,camFrom=null,camTo=null,camT=1;
const ease=p=>p<0?0:p>1?1:1-Math.pow(1-p,3);
function setStep(k){cur=Math.max(0,Math.min(S.length-1,k));t0=performance.now()/1000;
 S.forEach((s,i)=>{s.g.visible=i<=cur;s.items.forEach(m=>{const u=m.userData;if(i<cur){m.visible=!u.tmp;m.position.copy(u.fin)}else if(i>cur)m.visible=false})});
 const st=S[cur];const p=st.paint||S.slice(0,cur+1).some(s=>s.paint);
 MAT.bOut.color.setHex(p?PAINT_OUT:0xd9d4c7);MAT.bIn.color.setHex(p?PAINT_IN:0xe3dfd5);
 joists.visible=!(st.hide||[]).includes('joists');
 camFrom={p:camera.position.clone(),t:controls.target.clone()};const tt=V(...st.cam[1]),kz=innerWidth<innerHeight&&!st.near?1.35:1;camTo={p:V(...st.cam[0]).sub(tt).multiplyScalar(kz).add(tt),t:tt};camT=0;
 $('stn').textContent=`ขั้นที่ ${cur} / ${S.length-1}`;$('ttl').textContent=st.t;$('txt').innerHTML=st.x;$('prog').style.width=(cur/(S.length-1)*100)+'%';
 $('prev').disabled=cur===0;$('next').textContent=cur===S.length-1?'↺ เริ่มใหม่':'ขั้นถัดไป ▶';
 setTimeout(resize,0);
 if(voice)speak(st.t+' . '+st.x.replace(/<[^>]+>/g,''));
 try{localStorage.setItem('torteum_build_step',cur)}catch(e){}}
const $=id=>document.getElementById(id);
function speak(s){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.replace(/×/g,' คูณ ').replace(/½/g,'ครึ่ง'));u.lang='th-TH';u.rate=1.05;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('th'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
$('next').onclick=()=>setStep(cur===S.length-1?0:cur+1);
$('prev').onclick=()=>setStep(cur-1);
$('play').onclick=()=>{auto=!auto;$('play').textContent=auto?'⏸ หยุด':'▶ เล่นต่อเนื่อง';if(auto&&cur===S.length-1)setStep(0)};
$('voice').onclick=e=>{voice=!voice;e.target.classList.toggle('on',voice);e.target.textContent=voice?'🔊 เสียง':'🔇 เสียง';if(voice)speak(S[cur].t);else try{speechSynthesis.cancel()}catch(e){}};
$('xray').onclick=e=>{xray=!xray;e.target.classList.toggle('on',xray);[MAT.bOut,MAT.bIn,MAT.old].forEach(m=>{m.transparent=xray;m.opacity=xray?.25:1;m.depthWrite=!xray;m.needsUpdate=true})};
function resize(){const w=innerWidth,h=Math.max(200,innerHeight-document.querySelector('.panel').offsetHeight+8);renderer.setSize(w,h,false);$('c').style.height=h+'px';camera.aspect=w/h;camera.fov=w<h?62:50;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let saved=0;try{saved=+(localStorage.getItem('torteum_build_step')||0)}catch(e){}
camera.position.set(...S[0].cam[0]);controls.target.set(...S[0].cam[1]);setStep(saved||0);
controls.addEventListener('start',()=>{camT=1});
function loop(){requestAnimationFrame(loop);const now=performance.now()/1000,el=now-t0;
 S[cur].items.forEach(m=>{const u=m.userData,p=ease((el-u.d)/.6);m.visible=el>=u.d;m.position.copy(u.fin).addScaledVector(u.off,1-p)});
 if(S[cur].door)S[cur].door.rotation.y=.55*ease((el-1.2)/1.2);
 if(camT<1){camT=Math.min(1,camT+1/70);const e=ease(camT);camera.position.lerpVectors(camFrom.p,camTo.p,e);controls.target.lerpVectors(camFrom.t,camTo.t,e)}
 if(auto){const last=Math.max(0,...S[cur].items.map(m=>m.userData.d));if(el>Math.max(6,last+3.5)){if(cur<S.length-1)setStep(cur+1);else{auto=false;$('play').textContent='▶ เล่นต่อเนื่อง'}}}
 controls.update();renderer.render(scene,camera)}
loop();
</script>
